[project]
name = "nocfo-explorer"
version = "0.1.0"
description = "Yazi-inspired TUI to explore and manage NoCFO files and folders"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "textual>=0.80",
]

[project.scripts]
nocfo-explorer = "nocfo_explorer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nocfo_explorer"]
